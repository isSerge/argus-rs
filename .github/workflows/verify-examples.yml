name: Verify Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-examples-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cargo build --workspace --release

      - name: Run examples
        env:
          # Use specific RPC URLs to avoid rate limiting issues in CI.
          ARGUS__RPC_URLS: ${{ secrets.ARGUS__RPC_URLS }}
        run: |
          chmod +x ./run_examples.sh
          ./run_examples.sh
