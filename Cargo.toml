[workspace]
members = [
    "crates/*",
    ".",
]
resolver = "2"

[workspace.dependencies]
alloy = { version = "1.0.37", features = ["essentials"] }
argus-core = { path = "crates/argus-core" }
argus-providers = { path = "crates/argus-providers" }
argus-store = { path = "crates/argus-store" }
omnihook = { path = "crates/omnihook" }
rhai-analyzer = { path = "crates/rhai-analyzer" }
rhai-bigint = { path = "crates/rhai-bigint" }
rhai-evm = { path = "crates/rhai-evm" }
arc-swap = "1.7.1"
async-nats = "0.43.1"
async-trait = "0.1.88"
axum = "0.8.6"
bitflags = "2.9.4"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.45", features = ["derive"] }
config = { version = "0.15.13", features = ["yaml"] }
dashmap = { version = "6.1.0", features = ["serde"] }
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
lapin = "3.7.0"
minijinja = { version = "2.11.0", features = ["serde"] }
mockall = "0.13.1"
mockito = "1.7.0"
num-bigint = { version = "0.4.5", features = ["serde"] }
num-traits = "0.2.19"
rdkafka = { version = "0.38.0", features = ["cmake-build", "tokio"] }
regex = "1.11.1"
reqwest = { version = "=0.12.22", features = ["json"] }
reqwest-middleware = { version = "0.4.2", features = ["json"] }
reqwest-retry = "0.7.0"
rhai = { version = "1.22.2", features = ["sync", "internals", "decimal"] }
rust_decimal = { version = "1.37.2", features = ["maths"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = [
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio-rustls",
    "sqlite",
] }
tempfile = "3.8.1"
thiserror = "2.0.12"
tokio = { version = "1.47.0", features = ["full"] }
tokio-stream = "0.1.15"
tokio-util = "0.7.16"
tower = { version = "0.5.2", features = ["retry"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = { version = "2.5.2", features = ["serde"] }
urlencoding = "2.1.3"

[package]
name = "argus"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy.workspace = true
argus-core.workspace = true
argus-providers.workspace = true
argus-store.workspace = true
arc-swap.workspace = true
async-nats.workspace = true
async-trait.workspace = true
axum.workspace = true
bitflags.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
config.workspace = true
dashmap.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
lapin.workspace = true
minijinja.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
omnihook.workspace = true
rdkafka.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
rhai.workspace = true
rhai-analyzer.workspace = true
rhai-evm.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
argus-core = { path = "crates/argus-core", features = ["test-utils"] }
argus-store = { path = "crates/argus-store" }
mockall.workspace = true
mockito.workspace = true
tokio-stream.workspace = true
