logLevel: warn

server:
  listenV4: true
  httpHostV4: "0.0.0.0"
  httpPortV4: 4000
  readTimeout: 10s
  writeTimeout: 20s

database:
  evmJsonRpcCache:
    connectors:
      - id: memory-cache
        driver: memory
        memory:
          maxItems: 100000 # Cache up to 100,000 items in memory
    policies:
      # Cache all responses forever regardless of finality classification.
      # This is intentional for benchmark stability: if eRPC's evmStatePoller
      # cannot reach an upstream to determine the finalized block number, every
      # response falls into the "unknown" finality bucket and would otherwise
      # expire after 5 s — causing repeated cache-miss spikes during a run.
      - network: "*"
        method: "*"
        connector: memory-cache
        ttl: 0

projects:
  - id: main
    networks:
      - architecture: evm
        evm:
          chainId: 1 # Ethereum Mainnet
    upstreams:
      - id: 1rpc
        type: evm
        endpoint: https://1rpc.io/eth
        evm:
          chainId: 1
      - id: mevblocker
        type: evm
        endpoint: https://rpc.mevblocker.io
        evm:
          chainId: 1
      - id: llamarpc
        type: evm
        endpoint: https://eth.llamarpc.com
        evm:
          chainId: 1
      - id: ankr
        type: evm
        endpoint: https://rpc.ankr.com/eth
        evm:
          chainId: 1
      - id: publicnode
        type: evm
        endpoint: https://ethereum-rpc.publicnode.com
        evm:
          chainId: 1
      - id: drpc
        type: evm
        endpoint: https://eth.drpc.org
        evm:
          chainId: 1
      - id: cloudflare
        type: evm
        endpoint: https://cloudflare-eth.com
        evm:
          chainId: 1
